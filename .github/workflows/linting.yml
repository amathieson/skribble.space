name: Lint Code Base
on:
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # This built-in command tells GitHub how to read ESLint 'stylish' output
      - name: Setup ESLint Annotations
        run: echo "::add-matcher::.github/eslint-matcher.json"

      - name: Run ESLint
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }} --depth=1
            FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.(js|jsx|ts|tsx)$' | xargs)
          else
            FILES="."
          fi

          if [ -n "$FILES" ]; then
            npx eslint $FILES --format stylish | sed "s|$PWD/||g"
          else
            echo "No files to lint."
          fi
