name: Lint Code Base
on:
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to lint"
        required: true
        default: "master"

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  eslint:
    name: ESLint (changed files)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Detect changed files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }} --depth=1
            FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.(js|jsx|ts|tsx)$' || true)
          else
            FILES=$(git ls-files '*.js' '*.jsx' '*.ts' '*.tsx')
          fi
          echo "files=$FILES" >> $GITHUB_OUTPUT

      - name: Run ESLint with Relative Paths
        if: steps.changed.outputs.files != ''
        run: |
          # We run eslint and use sed to strip the absolute runner path
          # This converts /home/runner/work/repo/repo/src/file.js -> src/file.js
          npx eslint ${{ steps.changed.outputs.files }} --format stylish | sed "s|$PWD/||g"
