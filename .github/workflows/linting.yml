name: Lint Code Base
on:
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  eslint:
    name: Eslint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.branch || null }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 23
          cache: 'npm'

      - run: npm ci
      - uses: reviewdog/action-eslint@556a3fdaf8b4201d4d74d406013386aa4f7dab96 # v1.34.0
        with:
          reporter: github-pr-review
          eslint_flags: "--ext .js,.jsx --config eslint.config.js src/"
          fail_level: "error"
          filter_mode: diff_context
          github_token: ${{ secrets.GITHUB_TOKEN }}

  stylelint:
    name: Stylelint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.branch || null }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 23
          cache: 'npm'

      - name: stylelint
        uses: reviewdog/action-stylelint@086959bc5cd70db1b4954f45d8d396d9e3786bbb # v1.31.0
        with:
          reporter: github-pr-review # Change reporter.
          stylelint_input: 'src/**/*.{css,scss}'
          stylelint_flags: '--config stylelint.config.js'
          fail_level: "error"
          filter_mode: diff_context
          github_token: ${{ secrets.GITHUB_TOKEN }}
